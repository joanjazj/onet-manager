<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión OLT</title>
    <!-- FontAwesome para Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sidebar-width: 250px;
            --primary-color: #0f172a;
            --accent-color: #2563eb;
            --bg-body: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #334155;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: var(--bg-body);
            color: var(--text-main);
            overflow: hidden;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--primary-color);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        .sidebar-brand {
            padding: 24px;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-brand i {
            color: var(--accent-color);
        }

        .sidebar-menu {
            list-style: none;
            padding: 16px 12px;
            flex-grow: 1;
        }

        .menu-item {
            margin-bottom: 6px;
        }

        .menu-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .menu-link:hover, .menu-link.active {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.8rem;
            color: #64748b;
        }

        /* --- MAIN CONTENT AREA --- */
        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .top-navbar {
            height: 64px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
        }

        .navbar-title {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
        }

        .content-frame {
            flex-grow: 1;
            width: 100%;
            border: none;
            background-color: var(--bg-body);
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div>
            <div class="sidebar-brand">
                <i class="fa-solid fa-network-wired"></i>
                <span>ONET Manager</span>
            </div>

            <ul class="sidebar-menu">
                <li class="menu-item">
                    <a class="menu-link active" onclick="loadPage('/app/aprovisionar.html', this, 'Aprovisionamiento ONU/ONT')">
                        <i class="fa-solid fa-plus-circle"></i>
                        <span>Aprovisionar</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a class="menu-link" onclick="loadPage('/app/onts.html', this, 'OLTs & Clientes Registrados')">
                        <i class="fa-solid fa-server"></i>
                        <span>ONT Registradas</span>
                    </a>
                </li>
                <li class="menu-item">
                    <a class="menu-link" onclick="loadPage('http://172.25.57.2/', this, 'Monitoreo de Red (Zabbix)')">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Monitoreo</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="sidebar-footer">
            <span>Sistema v1.0 • Docker Environment</span>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-wrapper">
        <header class="top-navbar">
            <h1 class="navbar-title" id="page-title">Aprovisionamiento ONU/ONT</h1>
            <div class="system-status">
                <span class="status-dot"></span>
                <span>Zabbix & Docker Online</span>
            </div>
        </header>

        <!-- Dynamic Frame Area -->
        <iframe id="main-frame" class="content-frame" src="/app/aprovisionar.html"></iframe>
    </div>

    <script>
        function loadPage(url, element, title) {
            // Actualizar URL del iframe
            document.getElementById('main-frame').src = url;

            // Actualizar título
            document.getElementById('page-title').innerText = title;

            // Actualizar clase activa en el menú
            const links = document.querySelectorAll('.menu-link');
            links.forEach(link => link.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
